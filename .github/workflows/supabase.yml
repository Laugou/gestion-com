# Met à jour la base de données et les fonctions serveur sur Supabase.
# Lancement MANUEL uniquement (onglet Actions > Supabase > Run workflow) : une modification de la
# base en production doit être une décision, pas un effet de bord.
#
# Secrets requis :
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_REF   (identifiant du projet, visible dans l'adresse du tableau de bord Supabase)
#   SUPABASE_DB_PASSWORD   (mot de passe de la base choisi à la création du projet)
name: Supabase

on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Quoi mettre à jour"
        type: choice
        options: [base-et-fonctions, base-seulement, fonctions-seulement]
        default: base-et-fonctions

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Base de données (migrations)
        if: inputs.cible != 'fonctions-seulement'
        run: supabase db push
      - name: Fonctions serveur
        if: inputs.cible != 'base-seulement'
        run: |
          supabase functions deploy admin-utilisateurs
          supabase functions deploy assistant-redaction
          supabase functions deploy notifier-email --no-verify-jwt
          supabase functions deploy publier-reseaux
