# Contrôle automatique à chaque modification : les 40 tests des règles d'accès de la base
# et la vérification du code de l'application et des fonctions serveur.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-de-donnees:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Règles d'accès et circuit de validation
        run: tests/lancer_tests.sh

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx tsc --noEmit && npx vite build --mode demo
        working-directory: app
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fonctions serveur (types)
        working-directory: supabase/functions
        run: deno check admin-utilisateurs/index.ts notifier-email/index.ts assistant-redaction/index.ts
